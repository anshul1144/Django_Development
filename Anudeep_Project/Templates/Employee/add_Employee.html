<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  </head>
  <body>
    {% include "Employee/nav_employee.html" %}

    <h1 class="my-3 text-center">Add Employee Details</h1>

    <form class="px-4" action="{% url 'employee:add_employee' %}" method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="employee-name" class="form-label">Employee Name</label>
        <input type="text" class="form-control" id="employee-name" name="name" required />
      </div>
      <div class="mb-3">
        <label for="employee-email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="employee-email" name="email" required />
      </div>
      <div class="mb-3">
        <label for="employee-salary" class="form-label">Salary</label>
        <input type="number" class="form-control" id="employee-salary" name="salary" min="0" step="0.01" required />
      </div>

      <button type="submit" class="btn btn-success">Submit</button>
    </form>
  </body>
</html>
