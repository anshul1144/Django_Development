<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="shortcut icon" href="apple-touch-icon.ico" type="image/x-icon">
</head>
<body>
    <hr>
    <button id="btn1">Suscribe</button>
    <hr>
    <button class="tweet-button">Tweet</button>
    <button class="tweet-button">Share</button>

    <link rel="stylesheet" href="style.css">
    <hr>
    <button class="github-btn">
        <img src="github.jpg" alt="GitHub">
        <span>Sign in with GitHub</span>
    </button>

    <br><br>

    <button class="google-btn">

        <div class="google-icon">
            <img src="google.png" alt="Google">
        </div>

        <span>Sign in with Google</span>

    </button>

    <hr>

    <button class="linkedin-btn blue">
        <span class="linkedin-icon">in</span>
        <span>Apply With LinkedIn</span>
    </button>

    <br><br>

    <button class="linkedin-btn outline">
        <span class="linkedin-icon">in</span>
        <span>Apply With LinkedIn</span>
    </button>

    <br><br>

    <button class="linkedin-btn dark">
        <span class="linkedin-icon">in</span>
        <span>Apply With LinkedIn</span>
    </button>

    <hr>

    <div class="popup">
        <div class="header">
            <h2>Show drivers your<br>live location</h2>
            <img src="Uber.jpg" alt="icon" height="100" width="100">
        </div>
  
        <p>Drivers will see your live location from the time you request a ride to the start of your trip. You can stop sharing at anytime. Learn more at t.uber.com/ios-loc.</p>
  
        <button class="black-btn">CONFIRM</button>
        <button class="white-btn">NOT NOW</button>
    </div>


</body>
</html>
